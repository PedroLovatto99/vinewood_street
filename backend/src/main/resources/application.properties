spring.application.name=VinewoodStreet

spring.datasource.url=jdbc:postgresql://localhost:5432/vinewood_street_db
spring.datasource.username=postgres
spring.datasource.password=mlovatto

# JPA
spring.jpa.hibernate.ddl-auto=validate

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true


# Redis
spring.cache.type=redis
spring.cache.redis.time-to-live=10s

# Token
token_password=${TOKEN_PASSWORD}

# Gemini

spring.ai.google.genai.api-key=${GEMINI_API_KEY}

spring.ai.google.genai.chat.options.model=gemini-3.1-flash-lite-preview