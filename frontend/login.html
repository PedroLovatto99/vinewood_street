<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vinewood Street - Acesso</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-darker d-flex align-items-center py-4">

    <main class="form-signin w-100 m-auto">
        <div class="card shadow-lg border-success border-top border-4">
            <div class="card-body p-5 text-center">
                
                <h1 class="display-5 fw-bold text-success mb-1">Vinewood Street</h1>
                <p class="text-muted mb-4">Terminal de Corretores</p>

                <form id="loginForm">
                    
                    <div id="mensagemErro" class="alert alert-danger d-none text-start small" role="alert">
                        </div>

                    <div class="form-floating mb-3">
                        <input type="email" class="form-control" id="emailInput" placeholder="franklin@lsmail.com" required>
                        <label for="emailInput">E-mail</label>
                    </div>
                    
                    <div class="form-floating mb-4">
                        <input type="password" class="form-control" id="senhaInput" placeholder="Senha" required>
                        <label for="senhaInput">Senha</label>
                    </div>

                    <button class="btn btn-success w-100 py-2 fw-bold" type="submit" id="btnEntrar">
                        Acessar Sistema
                    </button>
                    
                </form>
            </div>
        </div>
    </main>

    <script src="js/login.js"></script>
</body>
</html>
